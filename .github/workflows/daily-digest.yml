name: Task Notifier

on:
  schedule:
    # Tiap 15 menit. Endpoint /internal/tick sendiri yang menentukan apakah
    # perlu kirim digest pagi (lihat DIGEST_HOUR_WIB) dan reminder per-tugas
    # yang remind_at-nya sudah lewat.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  trigger-tick:
    runs-on: ubuntu-latest
    steps:
      - name: Call /internal/tick
        run: |
          curl -sf -X POST "${{ secrets.APP_URL }}/internal/tick" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
